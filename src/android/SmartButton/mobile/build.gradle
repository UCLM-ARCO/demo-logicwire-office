apply plugin: 'com.android.application'
apply plugin: 'slice'

slice {
    java {
        // add a new file() for each .ice (even those included inside others .ice)
        files = [file("/usr/share/slice/duo/duo_idm.ice"),
                 file("/usr/share/slice/idm/idm.ice"),
                 file("/usr/share/slice/thing/thing.ice"),
                 file("/usr/share/slice/PropertyService/PropertyService.ice")
        ]

        // search path for includes
        args = "-I/usr/share/slice"
    }

    // add this if you want Android Studio to find .java and get completion
    output = file("src/generated")
}

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.2"

    defaultConfig {
        applicationId "es.uclm.esi.arco.smartbutton"
        minSdkVersion 18
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.java.srcDirs += ["$project.slice.output"]
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    wearApp project(':wear')
    testCompile 'junit:junit:4.12'
    compile 'com.android.support:appcompat-v7:23.3.0'
    compile 'com.android.support:design:23.3.0'
    compile 'com.google.android.gms:play-services:8.4.0'
    compile 'com.android.support:support-v4:23.3.0'
    compile 'com.google.zxing:core:3.2.1'
    compile 'com.journeyapps:zxing-android-embedded:3.2.0@aar'
    compile 'com.zeroc:ice:3.6.1'
}
